<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231B365D'/%3E%3C!-- horizont..."/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piping Material Intelligence — Salak Unit 7</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #f5f4ed;
  --ink: #1B365D;
  --ink-light: #2a4a7a;
  --olive: #6b6a5e;
  --warm-gray: #a09f94;
  --cream: #eae9e0;
  --card-bg: #faf9f4;
  --red: #b33a3a;
  --red-bg: #fdf2f2;
  --amber: #a06b1b;
  --amber-bg: #fef9ed;
  --green: #2d6a4f;
  --green-bg: #f0faf5;
  --blue-tag: #E4ECF5;
  --serif: Charter, Georgia, Palatino, "Times New Roman", serif;
  --sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --shadow-whisper: 0 2px 16px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 6px;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--sans);
  background: var(--parchment);
  color: #2c2c28;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  background: var(--ink);
  color: #fff;
  padding: 28px 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
}

.sidebar-brand {
  padding: 0 24px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-brand h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.02em;
  line-height: 1.3;
  color: #fff;
}

.sidebar-brand .subtitle {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 0;
  overflow-y: auto;
}

.nav-section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
  padding: 16px 24px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 24px;
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

.nav-item.active {
  background: rgba(255,255,255,0.08);
  color: #fff;
  border-left-color: #fff;
}

.nav-item svg { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active svg { opacity: 1; }

.nav-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}

.sidebar-footer {
  padding: 16px 24px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 11px;
  color: rgba(255,255,255,0.35);
}

.main {
  flex: 1;
  margin-left: 260px;
  padding: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(245,244,237,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--cream);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  color: var(--olive);
  width: 280px;
  transition: border-color var(--transition);
}

.search-box:focus-within { border-color: var(--ink); }
.search-box svg { width: 14px; height: 14px; opacity: 0.4; flex-shrink: 0; }

.search-box input {
  border: none;
  background: none;
  outline: none;
  font-family: var(--sans);
  font-size: 13px;
  color: #2c2c28;
  width: 100%;
}

.filter-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.filter-select {
  font-family: var(--sans);
  font-size: 12px;
  padding: 7px 12px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: #2c2c28;
  cursor: pointer;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236b6a5e' stroke-width='1[...]");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
}

.filter-select:focus { border-color: var(--ink); }

.content { padding: 24px 32px 48px; }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── KPI CARDS ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.kpi-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
  transition: transform var(--transition), box-shadow var(--transition);
}

.kpi-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-whisper);
}

.kpi-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--olive);
  margin-bottom: 8px;
}

.kpi-value {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.kpi-sub {
  font-size: 12px;
  color: var(--warm-gray);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.kpi-card.alert { border-left: 3px solid var(--red); }
.kpi-card.alert .kpi-value { color: var(--red); }
.kpi-card.warn { border-left: 3px solid var(--amber); }
.kpi-card.warn .kpi-value { color: var(--amber); }
.kpi-card.good { border-left: 3px solid var(--green); }
.kpi-card.good .kpi-value { color: var(--green); }

/* ── SECTION HEADERS ── */
.section-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 28px 0 16px;
}

.section-num {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 13px;
  color: var(--ink);
  opacity: 0.5;
}

.section-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 20px;
  color: var(--ink);
}

.section-sub {
  font-size: 12px;
  color: var(--olive);
  margin-left: auto;
}

/* ── TABLES ── */
.table-wrap {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.table-toolbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--cream);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.table-toolbar-left {
  display: flex;
  gap: 8px;
  align-items: center;
}

.table-toolbar .count {
  font-size: 12px;
  color: var(--olive);
  font-variant-numeric: tabular-nums;
}

.table-scroll { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--cream);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 10px;
  color: var(--olive);
  padding: 10px 12px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid #d8d7ce;
  cursor: pointer;
  user-select: none;
}

thead th:hover { color: var(--ink); }

thead th.sorted-asc::after { content: ' ▲'; font-size: 8px; }
thead th.sorted-desc::after { content: ' ▼'; font-size: 8px; }

tbody td {
  padding: 9px 12px;
  border-bottom: 1px solid #eeedea;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

tbody tr:hover { background: rgba(27,54,93,0.02); }

.cell-num { text-align: right; font-variant-numeric: tabular-nums; }

/* ── TAGS / BADGES ── */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.tag-green { background: #E8F5E9; color: var(--green); }
.tag-amber { background: #FFF8E1; color: var(--amber); }
.tag-red   { background: #FFEBEE; color: var(--red); }
.tag-blue  { background: var(--blue-tag); color: var(--ink); }
.tag-gray  { background: #ECEBE4; color: var(--olive); }

/* ── PROGRESS BAR ── */
.progress-bar {
  width: 80px;
  height: 6px;
  background: var(--cream);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}

.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}

.progress-fill.green { background: var(--green); }
.progress-fill.amber { background: var(--amber); }
.progress-fill.red   { background: var(--red); }
.progress-fill.blue  { background: var(--ink); }

/* ── CHARTS (CSS-only) ── */
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.chart-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-card);
}

.chart-card-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 16px;
}

.bar-chart { display: flex; flex-direction: column; gap: 8px; }

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bar-label {
  width: 140px;
  font-size: 11px;
  color: var(--olive);
  text-align: right;
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-track {
  flex: 1;
  height: 20px;
  background: var(--cream);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
  display: flex;
}

.bar-seg {
  height: 100%;
  transition: width 0.5s ease;
  position: relative;
}

.bar-seg.s-green { background: var(--green); }
.bar-seg.s-amber { background: var(--amber); }
.bar-seg.s-red   { background: #ccc; }

.bar-value {
  font-size: 11px;
  font-weight: 600;
  color: var(--olive);
  width: 50px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ── DONUT CHART ── */
.donut-container {
  display: flex;
  align-items: center;
  gap: 24px;
}

.donut-svg { width: 140px; height: 140px; }

.donut-legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--olive);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.legend-value {
  margin-left: auto;
  font-weight: 600;
  color: #2c2c28;
  font-variant-numeric: tabular-nums;
}

/* ── BUILDABILITY ── */
.build-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.build-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: all var(--transition);
}

.build-card:hover {
  border-color: var(--ink);
  box-shadow: var(--shadow-whisper);
}

.build-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.build-card-area {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  color: var(--ink);
}

.build-pct {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.build-bar {
  width: 100%;
  height: 8px;
  background: var(--cream);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 10px;
  display: flex;
}

.build-detail {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--olive);
}

.build-detail span { font-variant-numeric: tabular-nums; }

/* ── WORKFORCE PANEL ── */
.workforce-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.workforce-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
}

.workforce-card-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 6px;
}

.workforce-stat {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 10px;
}

.workforce-number {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 32px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.workforce-unit {
  font-size: 13px;
  color: var(--olive);
}

.workforce-breakdown {
  font-size: 12px;
  color: var(--olive);
  line-height: 1.7;
}

/* ── PAGINATION ── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 16px;
  font-size: 12px;
}

.page-btn {
  padding: 5px 10px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--olive);
  font-variant-numeric: tabular-nums;
  transition: all var(--transition);
}

.page-btn:hover { border-color: var(--ink); color: var(--ink); }
.page-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--parchment);
  border-radius: 8px;
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  padding: 28px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
}

.modal-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--olive);
  transition: all var(--transition);
}

.modal-close:hover { border-color: var(--ink); color: var(--ink); }

/* ── CONFIG MODAL ── */
.config-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--parchment);
  border-radius: 8px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  z-index: 300;
  max-width: 500px;
  width: 90%;
}

.config-modal h2 {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 12px;
}

.config-modal p {
  font-size: 13px;
  color: var(--olive);
  margin-bottom: 16px;
  line-height: 1.6;
}

.config-modal input {
  width: 100%;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 12px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  color: #2c2c28;
  margin-bottom: 16px;
  box-sizing: border-box;
}

.config-modal input:focus {
  outline: none;
  border-color: var(--ink);
  background: #fff;
}

.config-modal button {
  padding: 9px 16px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
}

.config-modal button:hover {
  background: var(--ink-light);
}

.config-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 299;
}

.config-overlay.active { display: block; }

/* ── RESPONSIVE ── */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 150;
  width: 36px;
  height: 36px;
  background: var(--ink);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobile-toggle { display: flex; }
  .topbar { padding-left: 56px; }
  .chart-grid { grid-template-columns: 1fr; }
  .search-box { width: 180px; }
}

@media (max-width: 600px) {
  .content { padding: 16px; }
  .topbar-actions { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
}

/* ── ANIMATIONS ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-in { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <!-- Logo bar: dua logo JO side-by-side -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.12);">
        <!-- TIMAS logo (SVG inline) -->
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;">
          <svg viewBox="0 0 56 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:56px;height:24px;">
            <!-- Hexagon mark -->
            <polygon points="4,12 8,5 14,5 18,12 14,19 8,19" fill="#c9a84c" opacity="0.9"/>
            <text x="5.5" y="15.5" font-family="Arial" font-size="7" font-weight="bold" fill="#1B365D">T</text>
            <!-- Wordmark -->
            <text x="21" y="9" font-family="Arial" font-size="5.5" font-weight="bold" fill="#c9a84c" letter-spacing="0.5">TIMAS</text>
            <text x="21" y="17" font-family="Arial" font-size="4" fill="rgba(255,255,255,0.7)" letter-spacing="0.2">SUPLINDO</text>
          </svg>
        </div>

        <!-- Divider -->
        <div style="width:1px;height:32px;background:rgba(255,255,255,0.15);flex-shrink:0;"></div>

// APPS SCRIPT CONFIGURATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbys-3N0oj_1_JCUoA_sPw4uMg980_6gZczdHoYwE0vHajEeoXQXo0ZqqkMqIdHg7-XrEA/exec';

// Function to call Apps Script
async function callAppsScript(action, data = {}) {
  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams({
        action: action,
        payload: JSON.stringify(data)
      })
    });
    
    const result = await response.json();
    return result;
  } catch (error) {
    console.error('Error calling Apps Script:', error);
    return { error: error.message };
  }
}

// Sync data from Google Sheets
async function syncFromSheets() {
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');
  
  syncBtn.disabled = true;
  syncBtn.classList.add('syncing');
  syncStatus.textContent = 'Syncing...';
  
  try {
    const result = await callAppsScript('syncData');
    
    if (result.success) {
      syncStatus.textContent = 'Synced ✓';
      syncStatus.style.color = 'var(--green)';
      // Reload data after sync
      setTimeout(() => {
        location.reload();
      }, 1500);
    } else {
      syncStatus.textContent = 'Error: ' + (result.message || 'Unknown error');
      syncStatus.style.color = 'var(--red)';
    }
  } catch (error) {
    syncStatus.textContent = 'Failed';
    syncStatus.style.color = 'var(--red)';
  } finally {
    syncBtn.disabled = false;
    syncBtn.classList.remove('syncing');
  }
}

// Get data from Google Sheets
async function fetchDataFromSheets() {
  try {
    const result = await callAppsScript('getData');
    
    if (result.success) {
      return result.data;
    } else {
      console.error('Error fetching data:', result.message);
      return null;
    }
  } catch (error) {
    console.error('Error:', error);
    return null;
  }
}
