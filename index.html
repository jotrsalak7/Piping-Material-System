<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piping Material System Monitoring — Salak Unit 7</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #f5f4ed;
  --ink: #1B365D;
  --ink-light: #2a4a7a;
  --olive: #6b6a5e;
  --warm-gray: #a09f94;
  --cream: #eae9e0;
  --card-bg: #faf9f4;
  --red: #b33a3a;
  --red-bg: #fdf2f2;
  --amber: #a06b1b;
  --amber-bg: #fef9ed;
  --green: #2d6a4f;
  --green-bg: #f0faf5;
  --blue-tag: #E4ECF5;
  --serif: Charter, Georgia, Palatino, "Times New Roman", serif;
  --sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  --shadow-whisper: 0 2px 16px rgba(0,0,0,0.04);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 6px;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--sans);
  background: var(--parchment);
  color: #2c2c28;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  background: var(--ink);
  color: #fff;
  padding: 28px 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
}

.sidebar-brand {
  padding: 0 24px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-brand h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 0.02em;
  line-height: 1.3;
  color: #fff;
}

.sidebar-brand .subtitle {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 0;
  overflow-y: auto;
}

.nav-section-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
  padding: 16px 24px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 24px;
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

.nav-item.active {
  background: rgba(255,255,255,0.08);
  color: #fff;
  border-left-color: #fff;
}

.nav-item svg { width: 16px; height: 16px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active svg { opacity: 1; }

.nav-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}

.sidebar-footer {
  padding: 16px 24px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 11px;
  color: rgba(255,255,255,0.35);
}

.main {
  flex: 1;
  margin-left: 260px;
  padding: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(245,244,237,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--cream);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 7px 14px;
  font-size: 13px;
  color: var(--olive);
  width: 280px;
  transition: border-color var(--transition);
}

.search-box:focus-within { border-color: var(--ink); }
.search-box svg { width: 14px; height: 14px; opacity: 0.4; flex-shrink: 0; }

.search-box input {
  border: none;
  background: none;
  outline: none;
  font-family: var(--sans);
  font-size: 13px;
  color: #2c2c28;
  width: 100%;
}

.filter-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.filter-select {
  font-family: var(--sans);
  font-size: 12px;
  padding: 7px 12px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  color: #2c2c28;
  cursor: pointer;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%236b6a5e' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 28px;
}

.filter-select:focus { border-color: var(--ink); }

.content { padding: 24px 32px 48px; }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── KPI CARDS ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.kpi-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
  transition: transform var(--transition), box-shadow var(--transition);
}

.kpi-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-whisper);
}

.kpi-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--olive);
  margin-bottom: 8px;
}

.kpi-value {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.kpi-sub {
  font-size: 12px;
  color: var(--warm-gray);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.kpi-card.alert { border-left: 3px solid var(--red); }
.kpi-card.alert .kpi-value { color: var(--red); }
.kpi-card.warn { border-left: 3px solid var(--amber); }
.kpi-card.warn .kpi-value { color: var(--amber); }
.kpi-card.good { border-left: 3px solid var(--green); }
.kpi-card.good .kpi-value { color: var(--green); }

/* ── SECTION HEADERS ── */
.section-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 28px 0 16px;
}

.section-num {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 13px;
  color: var(--ink);
  opacity: 0.5;
}

.section-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 20px;
  color: var(--ink);
}

.section-sub {
  font-size: 12px;
  color: var(--olive);
  margin-left: auto;
}

/* ── TABLES ── */
.table-wrap {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.table-toolbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--cream);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.table-toolbar-left {
  display: flex;
  gap: 8px;
  align-items: center;
}

.table-toolbar .count {
  font-size: 12px;
  color: var(--olive);
  font-variant-numeric: tabular-nums;
}

.table-scroll { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--cream);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 10px;
  color: var(--olive);
  padding: 10px 12px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid #d8d7ce;
  cursor: pointer;
  user-select: none;
}

thead th:hover { color: var(--ink); }

thead th.sorted-asc::after { content: ' ▲'; font-size: 8px; }
thead th.sorted-desc::after { content: ' ▼'; font-size: 8px; }

tbody td {
  padding: 9px 12px;
  border-bottom: 1px solid #eeedea;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

tbody tr:hover { background: rgba(27,54,93,0.02); }

.cell-num { text-align: right; font-variant-numeric: tabular-nums; }

/* ── TAGS / BADGES ── */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.tag-green { background: #E8F5E9; color: var(--green); }
.tag-amber { background: #FFF8E1; color: var(--amber); }
.tag-red   { background: #FFEBEE; color: var(--red); }
.tag-blue  { background: var(--blue-tag); color: var(--ink); }
.tag-gray  { background: #ECEBE4; color: var(--olive); }

/* ── PROGRESS BAR ── */
.progress-bar {
  width: 80px;
  height: 6px;
  background: var(--cream);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}

.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
}

.progress-fill.green { background: var(--green); }
.progress-fill.amber { background: var(--amber); }
.progress-fill.red   { background: var(--red); }
.progress-fill.blue  { background: var(--ink); }

/* ── CHARTS (CSS-only) ── */
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.chart-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-card);
}

.chart-card-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 16px;
}

.bar-chart { display: flex; flex-direction: column; gap: 8px; }

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bar-label {
  width: 140px;
  font-size: 11px;
  color: var(--olive);
  text-align: right;
  flex-shrink: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-track {
  flex: 1;
  height: 20px;
  background: var(--cream);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
  display: flex;
}

.bar-seg {
  height: 100%;
  transition: width 0.5s ease;
  position: relative;
}

.bar-seg.s-green { background: var(--green); }
.bar-seg.s-amber { background: var(--amber); }
.bar-seg.s-red   { background: #ccc; }

.bar-value {
  font-size: 11px;
  font-weight: 600;
  color: var(--olive);
  width: 50px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* ── DONUT CHART ── */
.donut-container {
  display: flex;
  align-items: center;
  gap: 24px;
}

.donut-svg { width: 140px; height: 140px; }

.donut-legend {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--olive);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.legend-value {
  margin-left: auto;
  font-weight: 600;
  color: #2c2c28;
  font-variant-numeric: tabular-nums;
}

/* ── BUILDABILITY ── */
.build-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.build-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: all var(--transition);
}

.build-card:hover {
  border-color: var(--ink);
  box-shadow: var(--shadow-whisper);
}

.build-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.build-card-area {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 15px;
  color: var(--ink);
}

.build-pct {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.build-bar {
  width: 100%;
  height: 8px;
  background: var(--cream);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 10px;
  display: flex;
}

.build-detail {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--olive);
}

.build-detail span { font-variant-numeric: tabular-nums; }

/* ── WORKFORCE PANEL ── */
.workforce-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.workforce-card {
  background: var(--card-bg);
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
}

.workforce-card-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 6px;
}

.workforce-stat {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 10px;
}

.workforce-number {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 32px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.workforce-unit {
  font-size: 13px;
  color: var(--olive);
}

.workforce-breakdown {
  font-size: 12px;
  color: var(--olive);
  line-height: 1.7;
}

/* ── PAGINATION ── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 16px;
  font-size: 12px;
}

.page-btn {
  padding: 5px 10px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  cursor: pointer;
  font-family: var(--sans);
  font-size: 12px;
  color: var(--olive);
  font-variant-numeric: tabular-nums;
  transition: all var(--transition);
}

.page-btn:hover { border-color: var(--ink); color: var(--ink); }
.page-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--parchment);
  border-radius: 8px;
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  padding: 28px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 18px;
  color: var(--ink);
}

.modal-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--cream);
  border-radius: var(--radius);
  background: var(--card-bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--olive);
  transition: all var(--transition);
}

.modal-close:hover { border-color: var(--ink); color: var(--ink); }

/* ── RESPONSIVE ── */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 150;
  width: 36px;
  height: 36px;
  background: var(--ink);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(27, 54, 93, 0.1);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobile-toggle { display: flex; }
  .topbar { padding-left: 56px; }
  .chart-grid { grid-template-columns: 1fr; }
  .search-box { width: 180px; }
}

@media (max-width: 600px) {
  .content { padding: 16px; }
  .topbar-actions { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
}

/* ── ANIMATIONS ── */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-in { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Piping Material Monitoring</h1>
      <div class="subtitle">Salak Unit 7 — Piping</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <div class="nav-item active" data-page="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>

      <div class="nav-section-label">Analysis</div>
      <div class="nav-item" data-page="buildability">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Buildability
        <span class="nav-badge" id="navBadgeBuild"></span>
      </div>
      <div class="nav-item" data-page="shortages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Shortages
        <span class="nav-badge" id="navBadgeShort"></span>
      </div>

      <div class="nav-section-label">Supply Chain</div>
      <div class="nav-item" data-page="supply">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        In Supply
      </div>
      <div class="nav-item" data-page="inventory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        On-Site Inventory
      </div>

      <div class="nav-section-label">Planning</div>
      <div class="nav-item" data-page="workforce">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Workforce
      </div>
      <div class="nav-item" data-page="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        All Items
      </div>
    </nav>
    <div class="sidebar-footer">
      JO Timas Suplindo — Rekayasa Industri<br>
      Data: Monitoring-Pi-Matl.
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearch" placeholder="Search ident, part, PO..." oninput="handleSearch()">
        </div>
        <div class="filter-group">
          <select class="filter-select" id="filterArea" onchange="applyFilters()">
            <option value="">All Areas</option>
          </select>
          <select class="filter-select" id="filterPackage" onchange="applyFilters()">
            <option value="">All Packages</option>
          </select>
          <select class="filter-select" id="filterStatus" onchange="applyFilters()">
            <option value="">All Status</option>
            <option value="On Site">On Site</option>
            <option value="Partial Delv.">Partial Delv.</option>
            <option value="-">Pending</option>
          </select>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- PAGE: OVERVIEW -->
      <div class="page active" id="page-overview"></div>

      <!-- PAGE: BUILDABILITY -->
      <div class="page" id="page-buildability"></div>

      <!-- PAGE: SHORTAGES -->
      <div class="page" id="page-shortages"></div>

      <!-- PAGE: SUPPLY -->
      <div class="page" id="page-supply"></div>

      <!-- PAGE: INVENTORY -->
      <div class="page" id="page-inventory"></div>

      <!-- PAGE: WORKFORCE -->
      <div class="page" id="page-workforce"></div>

      <!-- PAGE: ALL ITEMS -->
      <div class="page" id="page-all"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ════════════════════════════════════════════
// CONFIG — Google Sheets Integration
// ════════════════════════════════════════════
// Paste your deployed Apps Script URL here:
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhCbs76tI2hD_E7PEJhsda3_kQ2TXiA0F-aV5uJE_q0_96H2pkeIlA45v2BYvf3pHmlA/exec';
// ^ Replace YOUR_DEPLOYMENT_ID with the actual ID from your deployment
// Example: https://script.google.com/macros/d/1jh23j4h2j34h2j34h/usercss

// Field definitions
const FIELDS = ['area','package','bomTitle','identCode','partName','desc','lSize','qtyReq','unit','poNo','vendor','statusPO','mfgPct','eta','ata','pctDelv','qtySite','shortage','statusMtl'];

let ALL_DATA = [];
let filteredData = [];

// ════════════════════════════════════════════
// DATA LOADING
// ════════════════════════════════════════════
async function loadDataFromSheets() {
  try {
    const response = await fetch(APPS_SCRIPT_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    return json.data || [];
  } catch (err) {
    console.error('Failed to load data from Apps Script:', err);
    return [];
  }
}

function loadData(rawData) {
  // Convert compact arrays to objects
  return rawData.map(r => {
    const obj = {};
    FIELDS.forEach((f, i) => obj[f] = r[i]);
    return obj;
  });
}

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const rawData = await loadDataFromSheets();
  ALL_DATA = loadData(rawData);
  filteredData = [...ALL_DATA];
  populateFilters();
  renderOverview();
  setupNav();
});

function populateFilters() {
  const areas = [...new Set(ALL_DATA.map(d => d.area))].sort();
  const pkgs = [...new Set(ALL_DATA.map(d => d.package))].sort();
  const areaSelect = document.getElementById('filterArea');
  const pkgSelect = document.getElementById('filterPackage');
  areas.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; areaSelect.appendChild(o); });
  pkgs.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; pkgSelect.appendChild(o); });
}

function applyFilters() {
  const area = document.getElementById('filterArea').value;
  const pkg = document.getElementById('filterPackage').value;
  const status = document.getElementById('filterStatus').value;
  const search = document.getElementById('globalSearch').value.toLowerCase();

  filteredData = ALL_DATA.filter(d => {
    if (area && d.area !== area) return false;
    if (pkg && d.package !== pkg) return false;
    if (status && d.statusMtl !== status) return false;
    if (search) {
      const hay = [d.identCode, d.partName, d.desc, d.poNo, d.vendor, d.area, d.package].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const activePage = document.querySelector('.nav-item.active')?.dataset?.page || 'overview';
  renderPage(activePage);
}

function handleSearch() { applyFilters(); }

// ════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════
function setupNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const page = item.dataset.page;
      renderPage(page);
      document.querySelector('.sidebar').classList.remove('open');
    });
  });
  // Set badge counts
  const shortages = ALL_DATA.filter(d => d.shortage < 0).length;
  document.getElementById('navBadgeShort').textContent = shortages;
  const waitingPO = ALL_DATA.filter(d => d.statusPO === 'WAITING PO').length;
  document.getElementById('navBadgeBuild').textContent = waitingPO;
}

const PAGE_TITLES = {
  overview: 'Dashboard',
  buildability: 'Buildability Analysis',
  shortages: 'Shortage Alerts',
  supply: 'In Supply — Material Flow',
  inventory: 'On-Site Inventory',
  workforce: 'Workforce Planning',
  all: 'All Material Items'
};

function renderPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || 'Dashboard';

  switch(page) {
    case 'overview': renderOverview(); break;
    case 'buildability': renderBuildability(); break;
    case 'shortages': renderShortages(); break;
    case 'supply': renderSupply(); break;
    case 'inventory': renderInventory(); break;
    case 'workforce': renderWorkforce(); break;
    case 'all': renderAllItems(); break;
  }
}

// ════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════
function fmt(n) { return n.toLocaleString('en-US'); }
function pct(a, b) { return b > 0 ? Math.round(a/b*100) : 0; }
function statusTag(s) {
  if (s === 'On Site') return '<span class="tag tag-green">On Site</span>';
  if (s === 'Partial Delv.') return '<span class="tag tag-amber">Partial Delv.</span>';
  if (s === '-') return '<span class="tag tag-gray">Pending</span>';
  return '<span class="tag tag-blue">' + s + '</span>';
}

function poStatusTag(s) {
  if (s === 'WAITING PO') return '<span class="tag tag-red">WAITING PO</span>';
  if (s === 'ISSUED') return '<span class="tag tag-green">ISSUED</span>';
  if (s === 'CONFIRMED') return '<span class="tag tag-blue">CONFIRMED</span>';
  return '<span class="tag tag-gray">' + s + '</span>';
}

function openModal(title, html) {
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${title}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div>${html}</div>
  `;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ════════════════════════════════════════════
// PAGE RENDERERS (stubs below, expand with full code)
// ════════════════════════════════════════════

function renderOverview() {
  const el = document.getElementById('page-overview');
  if (!el) return;
  
  const total = filteredData.length;
  const onSite = filteredData.filter(d => d.statusMtl === 'On Site').length;
  const partial = filteredData.filter(d => d.statusMtl === 'Partial Delv.').length;
  const pending = filteredData.filter(d => d.statusMtl === '-').length;
  const shortages = filteredData.filter(d => parseFloat(d.shortage || 0) < 0).length;
  
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Items</div>
        <div class="kpi-value">${fmt(total)}</div>
      </div>
      <div class="kpi-card good">
        <div class="kpi-label">On Site</div>
        <div class="kpi-value">${fmt(onSite)}</div>
        <div class="kpi-sub">${pct(onSite, total)}%</div>
      </div>
      <div class="kpi-card warn">
        <div class="kpi-label">Partial Delv.</div>
        <div class="kpi-value">${fmt(partial)}</div>
        <div class="kpi-sub">${pct(partial, total)}%</div>
      </div>
      <div class="kpi-card alert">
        <div class="kpi-label">Pending</div>
        <div class="kpi-value">${fmt(pending)}</div>
        <div class="kpi-sub">${pct(pending, total)}%</div>
      </div>
      <div class="kpi-card alert">
        <div class="kpi-label">Shortages</div>
        <div class="kpi-value">${fmt(shortages)}</div>
        <div class="kpi-sub">${pct(shortages, total)}%</div>
      </div>
    </div>
    
    <div class="section-header">
      <span class="section-num">1</span>
      <span class="section-title">Material Status Summary</span>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <span class="count">${filteredData.length} items</span>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ident</th>
              <th>Part Name</th>
              <th>Area</th>
              <th>Package</th>
              <th>Qty Required</th>
              <th>Qty On-Site</th>
              <th>Shortage</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${filteredData.slice(0, 20).map(d => `
              <tr>
                <td><strong>${d.identCode}</strong></td>
                <td>${d.partName}</td>
                <td>${d.area}</td>
                <td>${d.package}</td>
                <td class="cell-num">${fmt(parseInt(d.qtyReq) || 0)}</td>
                <td class="cell-num">${fmt(parseInt(d.qtySite) || 0)}</td>
                <td class="cell-num">${d.shortage}</td>
                <td>${statusTag(d.statusMtl)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderBuildability() {
  const el = document.getElementById('page-buildability');
  if (!el) return;
  
  const byArea = {};
  filteredData.forEach(d => {
    if (!byArea[d.area]) byArea[d.area] = { total: 0, waiting: 0 };
    byArea[d.area].total++;
    if (d.statusPO === 'WAITING PO') byArea[d.area].waiting++;
  });
  
  el.innerHTML = `
    <div class="section-header">
      <span class="section-num">1</span>
      <span class="section-title">Buildability by Area</span>
    </div>
    <div class="build-grid">
      ${Object.entries(byArea).map(([area, stats]) => {
        const pct_val = 100 - Math.round(stats.waiting / stats.total * 100);
        const fill_color = pct_val >= 80 ? 'green' : pct_val >= 50 ? 'amber' : 'red';
        return `
          <div class="build-card">
            <div class="build-card-header">
              <div class="build-card-area">${area}</div>
              <div class="build-pct" style="color:${fill_color === 'green' ? 'var(--green)' : fill_color === 'amber' ? 'var(--amber)' : 'var(--red)'}">${pct_val}%</div>
            </div>
            <div class="build-bar">
              <div class="build-seg s-${fill_color}" style="width: ${pct_val}%"></div>
            </div>
            <div class="build-detail">
              <span>Ready: ${stats.total - stats.waiting}</span>
              <span>Waiting: ${stats.waiting}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderShortages() {
  const el = document.getElementById('page-shortages');
  if (!el) return;
  
  const shortages = filteredData.filter(d => parseFloat(d.shortage || 0) < 0).sort((a, b) => parseFloat(a.shortage) - parseFloat(b.shortage));
  
  el.innerHTML = `
    <div class="section-header">
      <span class="section-num">1</span>
      <span class="section-title">Critical Shortages</span>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <span class="count">${shortages.length} items with shortage</span>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ident</th>
              <th>Part</th>
              <th>Required</th>
              <th>On-Site</th>
              <th>Shortage</th>
              <th>Area</th>
              <th>Vendor</th>
              <th>ETA</th>
            </tr>
          </thead>
          <tbody>
            ${shortages.map(d => `
              <tr>
                <td><strong>${d.identCode}</strong></td>
                <td>${d.partName}</td>
                <td class="cell-num">${fmt(parseInt(d.qtyReq) || 0)}</td>
                <td class="cell-num">${fmt(parseInt(d.qtySite) || 0)}</td>
                <td class="cell-num" style="color: var(--red); font-weight: 600;">${d.shortage}</td>
                <td>${d.area}</td>
                <td>${d.vendor}</td>
                <td>${d.eta || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderSupply() {
  const el = document.getElementById('page-supply');
  if (!el) return;
  el.innerHTML = '<p>Supply chain view — In development</p>';
}

function renderInventory() {
  const el = document.getElementById('page-inventory');
  if (!el) return;
  
  const inv = filteredData.filter(d => d.statusMtl === 'On Site');
  el.innerHTML = `
    <div class="section-header">
      <span class="section-num">1</span>
      <span class="section-title">On-Site Inventory</span>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <span class="count">${inv.length} items on-site</span>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ident</th>
              <th>Part</th>
              <th>Qty On-Site</th>
              <th>Area</th>
              <th>Package</th>
              <th>Last Update</th>
            </tr>
          </thead>
          <tbody>
            ${inv.slice(0, 50).map(d => `
              <tr>
                <td><strong>${d.identCode}</strong></td>
                <td>${d.partName}</td>
                <td class="cell-num">${fmt(parseInt(d.qtySite) || 0)}</td>
                <td>${d.area}</td>
                <td>${d.package}</td>
                <td>${d.ata || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderWorkforce() {
  const el = document.getElementById('page-workforce');
  if (!el) return;
  el.innerHTML = '<p>Workforce planning view — In development</p>';
}

function renderAllItems() {
  const el = document.getElementById('page-all');
  if (!el) return;
  
  el.innerHTML = `
    <div class="section-header">
      <span class="section-num">1</span>
      <span class="section-title">All Material Items</span>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <span class="count">${filteredData.length} total items</span>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ident</th>
              <th>Part Name</th>
              <th>Desc</th>
              <th>Qty Req</th>
              <th>Qty Site</th>
              <th>PO Status</th>
              <th>Material Status</th>
              <th>Vendor</th>
              <th>ETA</th>
            </tr>
          </thead>
          <tbody>
            ${filteredData.slice(0, 100).map(d => `
              <tr>
                <td><strong>${d.identCode}</strong></td>
                <td>${d.partName}</td>
                <td>${d.desc}</td>
                <td class="cell-num">${fmt(parseInt(d.qtyReq) || 0)}</td>
                <td class="cell-num">${fmt(parseInt(d.qtySite) || 0)}</td>
                <td>${poStatusTag(d.statusPO)}</td>
                <td>${statusTag(d.statusMtl)}</td>
                <td>${d.vendor}</td>
                <td>${d.eta || '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
</body>
